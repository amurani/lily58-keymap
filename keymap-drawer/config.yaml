    LBRC: "["
    RBRC: "]"
    BSLS: "\\"
    SCLN: ";"
    QUOT: "'"
    COMM: ","
    DOT: "."
    SLSH: "/"
    GRV: "`"
    EXLM: "!"
    AT: "@"
    HASH: "#"
    DLR: "$"
    PERC: "%"
    CIRC: "^"
    AMPR: "&"
    ASTR: "*"
    LPRN: "("
    RPRN: ")"
    TILD: "~"
    UNDS: "_"
    PLUS: "+"
    LCBR: "{"
    RCBR: "}"
    PIPE: "|"
    RGHT: RIGHT
